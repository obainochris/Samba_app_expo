kind = "mobile"
previewPath = "/samba/"
title = "Samba"
description = "A beauty services marketplace where clients discover trusted hair barbers, hair stylists, and makeup artists, then book home or shop appointments."
version = "1.0.0"
id = "artifacts/samba"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/samba/" ]
localPort = 22775

[services.development]
run = "pnpm --filter @workspace/samba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/samba", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/samba", "run", "serve" ]

[services.env]
PORT = "22775"
BASE_PATH = "/samba/"
